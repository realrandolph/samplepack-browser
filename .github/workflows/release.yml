name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -v tests

  package:
    name: Build Debian package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zip unzip python3-pil

      - name: Build .deb and release zip
        run: bash scripts/build_deb.sh

      - name: Validate package metadata
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          echo "Package: $deb"
          dpkg -I "$deb"

      - name: Validate package contents
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          dpkg -c "$deb" > /tmp/deb-contents.txt
          cat /tmp/deb-contents.txt
          for want in ./usr/bin/samplepack-browser \
                      ./usr/bin/samplepack-mcp \
                      ./usr/lib/samplepack-browser/server.py \
                      ./usr/lib/samplepack-browser/tray.py \
                      ./usr/lib/samplepack-browser/index.html \
                      ./usr/lib/samplepack-browser/vendor/pystray/__init__.py \
                      ./usr/share/applications/samplepack-browser.desktop \
                      ./usr/share/icons/hicolor/256x256/apps/samplepack-browser.png; do
            grep -qxF "$want" <(awk '{print $6}' /tmp/deb-contents.txt) \
              || { echo "missing from package: $want" >&2; exit 1; }
          done

      - name: Validate executable bit inside the zip
        run: |
          set -euo pipefail
          zip="dist/samplepack-browser-linux-mint.zip"
          unzip -t "$zip"
          unzip -Z "$zip"
          mode="$(unzip -Z "$zip" | awk '$NF ~ /\.deb$/ {print $1}')"
          echo "mode of .deb inside zip: ${mode}"
          case "$mode" in
            -rwx*) echo "executable bit preserved" ;;
            *) echo "the .deb inside the zip is not executable (mode ${mode})" >&2; exit 1 ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samplepack-browser-linux-mint
          path: |
            dist/samplepack-browser-linux-mint.zip
            dist/samplepack-browser_1.0.0_all.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to manual run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          {
            echo "### Manual build (no tag pushed)"
            echo
            echo "The package was built and uploaded as the workflow artifact"
            echo "\`samplepack-browser-linux-mint\`. Push a \`v*\` tag to publish it"
            echo "as a GitHub Release."
            echo
            echo '```'
            unzip -Z dist/samplepack-browser-linux-mint.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pystray pyinstaller six

      - name: Generate application icon
        run: python packaging/windows/make_icon.py

      - name: Freeze application with PyInstaller
        run: >
          pyinstaller --noconsole --onedir --name samplepack-browser
          --icon packaging/windows/icon.ico
          --add-data "index.html;."
          --add-data "icon.png;."
          --distpath build/windows/dist
          --workpath build/windows/build
          tray.py

      - name: Verify frozen application
        run: |
          $exe = "build/windows/dist/samplepack-browser/samplepack-browser.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller did not produce $exe"
          }
          Get-ChildItem build/windows/dist/samplepack-browser | Select-Object Name, Length

      - name: Copy installer icon next to the executable
        run: |
          Copy-Item packaging/windows/icon.ico build/windows/dist/samplepack-browser/icon.ico -Force
          if (-not (Test-Path build/windows/dist/samplepack-browser/icon.ico)) {
            throw "icon.ico was not copied into the application folder"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss'

      - name: Verify installer output
        run: |
          $setup = "dist/samplepack-browser-windows-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "installer not found: $setup"
          }
          $size = (Get-Item $setup).Length
          "installer size: {0:N0} bytes" -f $size
          if ($size -le 1MB) {
            throw "installer is too small ($size bytes); expected more than 1 MB"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samplepack-browser-windows
          path: dist/samplepack-browser-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -l release-assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/samplepack-browser-linux-mint.zip
            release-assets/samplepack-browser_1.0.0_all.deb
            release-assets/samplepack-browser-windows-setup.exe
            release-assets/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
